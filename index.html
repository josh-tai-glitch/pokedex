<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寶可夢圖鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html"><span class="ball"></span>寶可夢圖鑑</a>
      <nav class="site-nav">
        <a data-page="index.html" href="index.html">圖鑑</a>
        <a data-page="wiki.html" href="wiki.html">Wiki</a>
        <a data-page="types.html" href="types.html">屬性相剋表</a>
        <a data-page="compare.html" href="compare.html">比較</a>
        <a data-page="quiz.html" href="quiz.html">小測驗</a>
        <a id="random-btn" href="#" title="隨機看一隻">🎲</a>
        <button id="theme-btn" type="button" title="切換深色模式">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="search" type="search" placeholder="搜尋名稱、英文、日文、編號…">
      <div class="toolbar-row">
        <select id="gen-filter" aria-label="世代篩選"></select>
        <select id="sort" aria-label="排序">
          <option value="id">依編號（小→大）</option>
          <option value="id-desc">依編號（大→小）</option>
          <option value="total-desc">種族值總和（高→低）</option>
          <option value="speed-desc">速度（快→慢）</option>
          <option value="height-desc">身高（高→矮）</option>
          <option value="weight-desc">體重（重→輕）</option>
        </select>
        <label class="check"><input id="fav-only" type="checkbox"> ★ 只看收藏</label>
      </div>
      <div id="type-filters" class="filters"></div>
      <p id="count" class="count"></p>
    </section>
    <section id="grid" class="grid"><p class="loading">載入中…</p></section>
  </main>

  <footer class="site-footer">
    圖片來源：<a href="https://github.com/PokeAPI/sprites">PokeAPI/sprites</a>・本站為課堂作業，寶可夢版權屬於 Nintendo / Creatures / GAME FREAK
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="assets/app.js"></script>
  <script>initIndexPage();</script>
</body>
</html>
